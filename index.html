<script>
/* Pusta strona w przeglądarce. Otwarta z ikony na ekranie telefonu (aplikacja) – przejdź do aktualnej strony N75. */
(function () { var app = navigator.standalone === true || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: minimal-ui)').matches));
  if (app || /[?&]src=ekran/.test(location.search)) location.replace('/nowa/' + location.hash); })();
</script>
